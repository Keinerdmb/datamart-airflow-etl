version: '3.8'

# Configuración base común para todos los servicios de Airflow
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor             # Más rápido y liviano que Celery (no necesita Redis)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_pass}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow_metadata}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'             # Oculta los DAGs de ejemplo
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false' # Activa el DAG automáticamente
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    
    # Auto-conexión: Airflow registra AIRFLOW_CONN_<ID> como Connection automáticamente
    AIRFLOW_CONN_POSTGRES_DW: ${AIRFLOW_CONN_POSTGRES_DW:-postgresql://dw_admin:dw_secret_pass@postgres-dw:5432/datamart_dw}
    
    # Auto-variables: Airflow registra AIRFLOW_VAR_<NOMBRE> como Variable operativa
    AIRFLOW_VAR_RAW_DATA_PATH: ${AIRFLOW_VAR_RAW_DATA_PATH:-/opt/airflow/data/raw}
    AIRFLOW_VAR_PROCESSED_DATA_PATH: ${AIRFLOW_VAR_PROCESSED_DATA_PATH:-/opt/airflow/data/processed}
    AIRFLOW_VAR_ENV: ${AIRFLOW_VAR_ENV:-development}
    
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: pandas psycopg2-binary sqlalchemy
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # 1. Base de datos interna de Airflow (Metadatos)
  postgres-airflow:
    image: postgres:15-alpine
    container_name: datamart-postgres-airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_metadata}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow_metadata}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Base de datos del Data Warehouse analítico
  postgres-dw:
    image: postgres:15-alpine
    container_name: datamart-postgres-dw
    environment:
      POSTGRES_USER: ${DW_DB_USER:-dw_admin}
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD:-dw_secret_pass}
      POSTGRES_DB: ${DW_DB_NAME:-datamart_dw}
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
      # Ejecuta el script SQL en el primer arranque para crear las tablas
      - ./sql/init_dw.sql:/docker-entrypoint-initdb.d/init_dw.sql:ro
    ports:
      - "${DW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_DB_USER:-dw_admin} -d ${DW_DB_NAME:-datamart_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. Inicializador (migra base de datos y crea usuario admin)
  airflow-init:
    <<: *airflow-common
    container_name: datamart-airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-DataMart}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-Admin}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@datamart.com}" || true

  # 4. Servidor Web de Airflow (UI: http://localhost:8080)
  airflow-webserver:
    <<: *airflow-common
    container_name: datamart-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  # 5. Scheduler de Airflow (ejecuta los DAGs)
  airflow-scheduler:
    <<: *airflow-common
    container_name: datamart-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    command: scheduler
    restart: unless-stopped

  # 6. API REST de productos (catálogo legado)
  products-api:
    image: apache/airflow:2.8.1
    container_name: datamart-products-api
    command: bash -c "pip install --no-cache-dir fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /app"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    restart: unless-stopped

volumes:
  postgres_airflow_data:
  postgres_dw_data:
